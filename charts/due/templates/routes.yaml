# Gateway API routing (the successor to Ingress). The shared Gateway lives in the
# "gateway" namespace; this app only says which paths go where.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: due
  labels:
    {{- include "due.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https
  hostnames: [{{ .Values.host | quote }}]
  rules:
    # Logins get their own rule so they can have a tighter rate limit.
    - name: login
      matches:
        - path: { type: Exact, value: /api/auth/login }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /auth/login }
      backendRefs:
        - { name: due-api, port: 8000 }
    - name: api
      matches:
        - path: { type: PathPrefix, value: /api }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: / }
      backendRefs:
        - { name: due-api, port: 8000 }
    - name: web
      matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: due-web, port: 8080 }
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: due-rate-limits
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: due
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - path: { type: Exact, value: /api/auth/login }
          limit:
            requests: {{ .Values.rateLimit.loginsPerMinute }}
            unit: Minute
        - clientSelectors:
            - path: { type: PathPrefix, value: /api }
          limit:
            requests: {{ .Values.rateLimit.requestsPerSecond }}
            unit: Second
