apiVersion: apps/v1
kind: Deployment
metadata:
  name: due-api
  labels:
    {{- include "due.labels" . | nindent 4 }}
    app.kubernetes.io/name: due-api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: due-api
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        {{- include "due.labels" . | nindent 8 }}
        app.kubernetes.io/name: due-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: due-api
      containers:
        - name: api
          image: "{{ .Values.images.registry }}/due-api:{{ include "due.tag" . }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: production
            # The gateway strips /api before forwarding; this puts it back in generated links.
            - name: UVICORN_ROOT_PATH
              value: /api
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: DATABASE_PASSWORD }
            - name: DATABASE_URL
              value: "postgresql+psycopg://due:$(DATABASE_PASSWORD)@due-postgres:5432/due"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: JWT_SECRET }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          # Ready only when the database answers too, so traffic never goes to a pod that can't serve it.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "due.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: due-api
  labels:
    {{- include "due.labels" . | nindent 4 }}
    app.kubernetes.io/name: due-api
spec:
  selector:
    app.kubernetes.io/name: due-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: due-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: due-api
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: due-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: due-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
{{- end }}
