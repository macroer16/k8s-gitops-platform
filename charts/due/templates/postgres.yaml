apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: due-postgres
  labels:
    {{- include "due.labels" . | nindent 4 }}
    app.kubernetes.io/name: due-postgres
spec:
  serviceName: due-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: due-postgres
  template:
    metadata:
      labels:
        {{- include "due.labels" . | nindent 8 }}
        app.kubernetes.io/name: due-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        # uid 70 is the postgres user in the Alpine image.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - { name: POSTGRES_USER, value: due }
            - { name: POSTGRES_DB, value: due }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: DATABASE_PASSWORD }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "due", "-d", "due"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "due", "-d", "due"] }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "due.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: { sizeLimit: 8Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: due-postgres
  labels:
    {{- include "due.labels" . | nindent 4 }}
    app.kubernetes.io/name: due-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: due-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
