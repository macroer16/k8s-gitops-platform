# Wave -3: building blocks everything else depends on (CRDs, controllers).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  {{- include "apps.meta" . | nindent 2 }}
  annotations: { argocd.argoproj.io/sync-wave: "-3" }
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: {{ .Values.versions.certManager }}
    helm:
      valuesObject:
        crds: { enabled: true }
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          kind: ControllerConfiguration
          enableGatewayAPI: false
  destination: { server: https://kubernetes.default.svc, namespace: cert-manager }
  {{- include "apps.syncPolicy" . | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  {{- include "apps.meta" . | nindent 2 }}
  annotations: { argocd.argoproj.io/sync-wave: "-3" }
spec:
  project: default
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: {{ .Values.versions.envoyGateway }}
  destination: { server: https://kubernetes.default.svc, namespace: envoy-gateway-system }
  {{- include "apps.syncPolicy" . | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  {{- include "apps.meta" . | nindent 2 }}
  annotations: { argocd.argoproj.io/sync-wave: "-3" }
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: {{ .Values.versions.kyverno }}
    helm:
      valuesObject:
        admissionController:
          replicas: 1
          container:
            extraArgs:
              allowInsecureRegistry: {{ .Values.policies.allowInsecureRegistry }}
        backgroundController: { replicas: 1 }
        cleanupController: { replicas: 1 }
        reportsController: { replicas: 1 }
  destination: { server: https://kubernetes.default.svc, namespace: kyverno }
  {{- include "apps.syncPolicy" . | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  {{- include "apps.meta" . | nindent 2 }}
  annotations: { argocd.argoproj.io/sync-wave: "-3" }
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: {{ .Values.versions.sealedSecrets }}
    helm:
      valuesObject:
        # The name kubeseal looks for by default.
        fullnameOverride: sealed-secrets-controller
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  {{- include "apps.syncPolicy" . | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  {{- include "apps.meta" . | nindent 2 }}
  annotations: { argocd.argoproj.io/sync-wave: "-3" }
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server
    chart: metrics-server
    targetRevision: {{ .Values.versions.metricsServer }}
    helm:
      valuesObject:
        # Local clusters (k3d, kind) use self-signed kubelet certificates.
        args: ["--kubelet-insecure-tls"]
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  {{- include "apps.syncPolicy" . | nindent 2 }}
