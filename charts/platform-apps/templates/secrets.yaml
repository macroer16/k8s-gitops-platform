{{- if .Values.secretsPath }}
# Encrypted secrets (SealedSecrets) committed to Git. Only the sealed-secrets controller
# in this cluster has the key to decrypt them. Created by scripts/make-secrets.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-app-secrets
  {{- include "apps.meta" . | nindent 2 }}
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: {{ .Values.secretsPath }}
  destination: { server: https://kubernetes.default.svc, namespace: due }
  syncPolicy:
    automated: { prune: false, selfHeal: true }
{{- end }}
