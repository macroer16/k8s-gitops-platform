# A private certificate authority for the cluster, created by cert-manager:
# self-signed root -> CA issuer -> certificate for the gateway.
# (On a real domain this would be a Let's Encrypt issuer instead.)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k8s-gitops-platform local CA
  secretName: platform-root-ca
  duration: 87600h
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-ca
spec:
  ca:
    secretName: platform-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: gateway
spec:
  secretName: gateway-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - "due.{{ .Values.domain }}"
    - "argocd.{{ .Values.domain }}"
    - "grafana.{{ .Values.domain }}"
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  issuerRef: { name: platform-ca, kind: ClusterIssuer }
