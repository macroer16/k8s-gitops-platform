# The platform's own tools, reachable through the same gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - { name: main, namespace: gateway, sectionName: https }
  hostnames: ["argocd.{{ .Values.domain }}"]
  rules:
    - backendRefs:
        - { name: argocd-server, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - { name: main, namespace: gateway, sectionName: https }
  hostnames: ["grafana.{{ .Values.domain }}"]
  rules:
    - backendRefs:
        - { name: monitoring-grafana, port: 80 }
