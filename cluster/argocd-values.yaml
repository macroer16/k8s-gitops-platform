# Helm values for ArgoCD itself (chart argo/argo-cd).
configs:
  params:
    # TLS ends at the Gateway, so ArgoCD serves plain HTTP inside the cluster.
    server.insecure: true
    # Compare Git with the cluster using the API server's own dry-run, so fields that
    # controllers fill in themselves (Kyverno, CRD defaults) don't show as drift.
    controller.diff.server.side: true
  cm:
    # Lets sync waves wait until the previous wave's Applications are actually healthy.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
    timeout.reconciliation: 60s
    # Aggregated ClusterRoles get their rules filled in by Kubernetes; that isn't drift.
    resource.compareoptions: |
      ignoreAggregatedRoles: true
  repositories:
    envoy-oci:
      url: docker.io/envoyproxy
      name: envoyproxy
      type: helm
      enableOCI: "true"
dex:
  enabled: false
notifications:
  enabled: false
