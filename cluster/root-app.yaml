# The only thing applied by hand. Everything else is created by ArgoCD from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/macroer16/k8s-gitops-platform.git
    targetRevision: ${REVISION}
    path: charts/platform-apps
    helm:
      valueFiles:
        - values.yaml
        - values-${CLUSTER}.yaml
      parameters:
        - name: revision
          value: ${REVISION}
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
